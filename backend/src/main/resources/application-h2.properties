# =====================================================================
#  Perfil H2 (OFFLINE / plano B) - zero instalacao, banco em arquivo.
#  Ative com:  mvn spring-boot:run -Dspring-boot.run.profiles=h2
#  Console web em http://localhost:8080/h2-console
# =====================================================================
spring.datasource.url=jdbc:h2:file:./data/protege;DB_CLOSE_ON_EXIT=FALSE;AUTO_SERVER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
