# =====================================================================
#  Perfil H2 - banco embutido em arquivo. Perfil PADRAO do projeto.
#
#  Escolhido para a demonstracao porque a comanda exige que o sistema
#  funcione ao ser descompactado e aberto localmente: o H2 nao precisa
#  de instalacao, servico nem credencial.
#
#  Console web: http://localhost:8080/h2-console
#     JDBC URL: jdbc:h2:file:./data/protege
#     Usuario : sa      (sem senha)
#
#  Observacao tecnica: AUTO_SERVER=TRUE foi removido porque o H2 2.2.x
#  nao permite combina-lo com DB_CLOSE_ON_EXIT=FALSE. Como a aplicacao e
#  o unico processo que abre o banco, o modo servidor e desnecessario.
# =====================================================================
spring.datasource.url=jdbc:h2:file:./data/protege;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

spring.jpa.hibernate.ddl-auto=update
