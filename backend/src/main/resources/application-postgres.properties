# =====================================================================
#  PostgreSQL agora e o padrao (veja application.properties).
#  Basta definir as variaveis de ambiente DB_URL, DB_USER e DB_PASSWORD.
#  Este perfil e mantido apenas por compatibilidade e repete o padrao.
# =====================================================================
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/protege}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
