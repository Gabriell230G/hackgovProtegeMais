# =====================================================================
#  Perfil POSTGRES - banco de producao (PostgreSQL / Supabase).
#
#  NAO e o perfil padrao. O padrao e 'h2', para que o projeto rode ao ser
#  descompactado, sem instalacao nem credencial - exigencia da entrega.
#
#  Ativar com:
#     .\build.cmd run -Dspring-boot.run.profiles=postgres
#     ou definindo SPRING_PROFILES_ACTIVE=postgres
#
#  Requer as variaveis DB_URL, DB_USER e DB_PASSWORD.
# =====================================================================
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/protege}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
