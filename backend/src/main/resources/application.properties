# =====================================================================
#  Protege+ Backend - Configuracao
# =====================================================================
spring.application.name=protege-backend
server.port=8080

# ---------------------------------------------------------------------
#  PERFIL PADRAO: h2 (banco embutido, zero instalacao).
#  Faz o projeto rodar assim que for descompactado, sem configurar nada.
#  Para usar PostgreSQL/Supabase:
#     mvn spring-boot:run -Dspring-boot.run.profiles=postgres
#  ou defina a variavel de ambiente SPRING_PROFILES_ACTIVE=postgres
# ---------------------------------------------------------------------
spring.profiles.active=${SPRING_PROFILES_ACTIVE:h2}

# ---------------------------------------------------------------------
#  BANCO DE DADOS
#
#  As linhas abaixo sao a configuracao do PostgreSQL, usada quando o perfil
#  'postgres' esta ativo. Com o perfil PADRAO ('h2', definido acima), elas
#  sao sobrescritas por application-h2.properties e nao tem efeito.
#
#  Para usar PostgreSQL / Supabase, defina DB_URL, DB_USER e DB_PASSWORD e
#  ative o perfil. (No Supabase: Project Settings > Database > Connection.)
# ---------------------------------------------------------------------
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/protege}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
# Dialeto NAO e declarado: o Hibernate 6 o detecta pela conexao. Fixa-lo
# aqui fazia o perfil h2 herdar o dialeto do PostgreSQL e gerar SQL do
# banco errado - funcionava por coincidencia, nao por acerto.
spring.jpa.show-sql=false
# Desligado de proposito: com open-in-view ligado, a sessao do banco fica
# aberta durante a serializacao da resposta, escondendo consultas extras
# fora da camada de servico. As colecoes necessarias sao carregadas
# explicitamente (o historico da denuncia e EAGER).
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true

# Popula dados de exemplo na 1a execucao (data.sql - idempotente)
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always

# ---------------------------------------------------------------------
#  AUTENTICACAO (JWT) - login do gestor
# ---------------------------------------------------------------------
# Segredo do token (>= 32 caracteres). Troque em producao via env JWT_SECRET.
jwt.secret=${JWT_SECRET:protege-gov-hackgov-fiap-egesp-chave-secreta-2026}
# Validade do token em milissegundos (8 horas)
jwt.expiration=28800000
# Usuario gestor criado automaticamente na 1a execucao (troque em producao)
app.admin.email=${ADMIN_EMAIL:admin@protege.gov.br}
app.admin.senha=${ADMIN_SENHA:admin123}
app.admin.nome=Gestor Protege+

# ---------------------------------------------------------------------
#  IA - Google Gemini (opcional). Sem a chave, o VigIA usa regras.
#  Chave gratuita em https://aistudio.google.com/apikey (env GEMINI_API_KEY).
# ---------------------------------------------------------------------
gemini.api.key=${GEMINI_API_KEY:}
gemini.api.model=gemini-1.5-flash
gemini.api.url=https://generativelanguage.googleapis.com/v1beta/models

# ---------------------------------------------------------------------
#  Swagger / OpenAPI
# ---------------------------------------------------------------------
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs

# ---------------------------------------------------------------------
#  CORS - origens autorizadas a chamar a API pelo navegador.
#  Lista explicita em vez de curinga: com "*" e credenciais habilitadas,
#  qualquer site poderia disparar requisicoes autenticadas contra esta API
#  a partir do navegador de um servidor ja logado.
# ---------------------------------------------------------------------
app.cors.origens=${CORS_ORIGENS:http://localhost:5500,http://127.0.0.1:5500,http://localhost:5501,http://127.0.0.1:5501,http://localhost:8080,http://127.0.0.1:8080,http://localhost:3000}


# =====================================================================
#  EVIDENCIAS (arquivos anexados as denuncias)
#
#  Os arquivos ficam FORA da pasta servida pelo servidor web, com nome
#  gerado. Arquivo dentro do diretorio publico e arquivo que qualquer
#  pessoa baixa adivinhando a URL - e evidencia de denuncia e o unico
#  conteudo deste sistema que pode conter o rosto da vitima.
#
#  O limite do Spring (6 MB) e proposital: fica acima do limite da
#  aplicacao (5 MB) para que o arquivo grande seja recusado pela regra
#  de negocio, com mensagem em portugues, e nao pelo container com um
#  erro generico que o usuario nao entende.
# =====================================================================
app.evidencias.dir=${EVIDENCIAS_DIR:./data/evidencias}
spring.servlet.multipart.max-file-size=6MB
spring.servlet.multipart.max-request-size=8MB
