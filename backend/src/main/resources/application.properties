# =====================================================================
#  Protege+ Backend - Configuracao
# =====================================================================
spring.application.name=protege-backend
server.port=8080

# ---------------------------------------------------------------------
#  BANCO DE DADOS - Padrao: PostgreSQL na nuvem (Supabase / Neon)
#  Defina as variaveis de ambiente abaixo com os dados do seu projeto.
#  (No Supabase: Project Settings > Database > Connection string.)
#  Para rodar OFFLINE com H2, use:  --spring.profiles.active=h2
# ---------------------------------------------------------------------
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/protege}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# Popula dados de exemplo na 1a execucao (data.sql - idempotente)
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always

# ---------------------------------------------------------------------
#  AUTENTICACAO (JWT) - login do gestor
# ---------------------------------------------------------------------
# Segredo do token (>= 32 caracteres). Troque em producao via env JWT_SECRET.
jwt.secret=${JWT_SECRET:protege-gov-hackgov-fiap-egesp-chave-secreta-2026}
# Validade do token em milissegundos (8 horas)
jwt.expiration=28800000
# Usuario gestor criado automaticamente na 1a execucao (troque em producao)
app.admin.email=${ADMIN_EMAIL:admin@protege.gov.br}
app.admin.senha=${ADMIN_SENHA:admin123}
app.admin.nome=Gestor Protege+

# ---------------------------------------------------------------------
#  IA - Google Gemini (opcional). Sem a chave, o VigIA usa regras.
#  Chave gratuita em https://aistudio.google.com/apikey (env GEMINI_API_KEY).
# ---------------------------------------------------------------------
gemini.api.key=${GEMINI_API_KEY:}
gemini.api.model=gemini-1.5-flash
gemini.api.url=https://generativelanguage.googleapis.com/v1beta/models

# ---------------------------------------------------------------------
#  Swagger / OpenAPI
# ---------------------------------------------------------------------
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs
